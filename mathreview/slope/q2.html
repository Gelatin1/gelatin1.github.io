<!doctype html>
<html lang="en">
	<head>
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<meta property="og:type" content="website">
		<meta property="og:site_name" content="Lukas's Website">
		<meta property="og:title" content="Lukas's Website">
		<meta property="og:description" content="This is my super boring website.">
		<meta property="og:image" content="/img/koala.png">
		<title>Slope: Question 2</title>
		<link rel="stylesheet" href="/style.css">
		<link rel="icon" href="/img/koala.png">
	</head>
	<body>
		<div class="header">
			<button>
				<a href="/">Home</a>
			</button>
            <button>
                <a href="./">Back</a>
            </button>
		</div>
        <div class="main">
		    <div class="float">
			    <h1>Slope: Question 2</h1>
                <p>
                    Graph a line that goes through the points (0,3) and (2,-1). What is the slope of the line?
                </p>
		    </div>
            <div class="float">
                <form id="answerform">
                    <input type="radio" id="a" name="answer" value="-2/1">
                    <label for="a">-2/1</label><br>
                    <input type="radio" id="b" name="answer" value="-1/2">
                    <label for="b">-1/2</label><br>
                    <input type="radio" id="c" name="answer" value="2/1">
                    <label for="c">2/1</label><br>
                    <input type="radio" id="d" name="answer" value="1/2">
                    <label for="d">1/2</label><br>
                    <input type="submit" value="Submit">
                </form>
            </div>
        </div>
		<div class="footer">
			<p>
				&#8239;This page brought to you by Lukas
			</p>
		</div>
		<script>
			var answerform = document.getElementById('answerform');
			answerform.addEventListener('submit', function(event) {
				var answer = answerform.elements["answer"].value;
				event.preventDefault();
				if(answer === '-2/1') {
					alert('Great job! You correctly answered the question. Click the \'Back\' button on the top bar to go back to the menu.');
					return;
				} else {
					alert('Incorrect answer. Please try again.');
					return;
				};
			});
		</script>
	</body>
</html>
