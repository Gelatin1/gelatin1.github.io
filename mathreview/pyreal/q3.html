<!doctype html>
<html lang="en">
	<head>
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<meta property="og:type" content="website">
		<meta property="og:site_name" content="Lukas's Website">
		<meta property="og:title" content="Lukas's Website">
		<meta property="og:description" content="This is my super boring website.">
		<meta property="og:image" content="/img/koala.png">
		<title>Py./Real: Question 3</title>
		<link rel="stylesheet" href="/style.css">
		<link rel="icon" href="/img/koala.png">
	</head>
	<body>
		<div class="header">
			<button>
				<a href="/">Home</a>
			</button>
            <button>
                <a href="./">Back</a>
            </button>
		</div>
        <div class="main">
		    <div class="float">
			    <h1>Py./Real: Question 3</h1>
                <p>
                    Question 3: Check the boxes for the number(s) that are rational.
                </p>
		    </div>
            <div class="float">
                <form id="answerform">
                    <input type="checkbox" id="a" name="answer1">
                    <label for="a">√36</label><br>
                    <input type="checkbox" id="b" name="answer2">
                    <label for="b">0.6̅2̅</label><br>
                    <input type="checkbox" id="c" name="answer3">
                    <label for="c">1.5</label><br>
                    <input type="checkbox" id="d" name="answer4">
                    <label for="d">√92</label><br>
                    <input type="checkbox" id="d" name="answer5">
                    <label for="d">8</label><br>
                    <input type="submit" value="Submit">
                </form>
            </div>
        </div>
		<div class="footer">
			<p>
				&#8239;This page brought to you by Lukas
			</p>
		</div>
		<script>
			var answerform = document.getElementById('answerform');
			answerform.addEventListener('submit', function(event) {
				var a = document.getElementById('a').checked;
                var b = document.getElementById('b').checked;
                var c = document.getElementById('c').checked;
                var d = document.getElementById('d').checked;
                var e = document.getElementById('e').checked;
				event.preventDefault();
				if(a === false && b === true && c === true && d === false && e === true) {
					alert('Great job! You correctly answered the question. Click the \'Back\' button on the top bar to go back to the menu.');
					return;
				} else {
					alert('Incorrect answer. Please try again.');
					return;
				};
			});
		</script>
	</body>
</html>
