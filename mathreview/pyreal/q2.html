<!doctype html>
<html lang="en">
	<head>
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<meta property="og:type" content="website">
		<meta property="og:site_name" content="Lukas's Website">
		<meta property="og:title" content="Lukas's Website">
		<meta property="og:description" content="This is my super boring website.">
		<meta property="og:image" content="/img/koala.png">
		<title>Py./Real: Question 2</title>
		<link rel="stylesheet" href="/style.css">
		<link rel="icon" href="/img/koala.png">
	</head>
	<body>
		<div class="header">
			<button>
				<a href="/">Home</a>
			</button>
            <button>
                <a href="./">Back</a>
            </button>
		</div>
        <div class="main">
		    <div class="float">
			    <h1>Py./Real: Question 2</h1>
                <p>
                    Without using a calculator, order the numbers below from least to greatest. Enter the letters in order separated by single spaces<br>
                    a. √102<br>
                    b. 10<br>
                    c. 3π<br>
                    d. √99<br>
                    e. 1.1 × 10¹<br>
                    f. 9.099
                </p>
		    </div>
            <div class="float">
                <form id="answerform">
                    <label for="answer">Answer:</label>
                    <input type="text" id="answer" name="answer">
                    <input type="submit" value="Submit">
                </form>
            </div>
        </div>
		<div class="footer">
			<p>
				&#8239;This page brought to you by Lukas
			</p>
		</div>
		<script>
			var answerform = document.getElementById('answerform');
			answerform.addEventListener('submit', function(event) {
				var answer = document.getElementById('answer').value;
				event.preventDefault();
				if(answer === 'f c d b a e') {
					alert('Great job! You correctly answered the question. Click the \'Back\' button on the top bar to go back to the menu.');
					return;
				} else {
					alert('Incorrect answer. Please try again.');
					return;
				};
			});
		</script>
	</body>
</html>
