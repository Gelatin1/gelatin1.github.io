<!doctype html>
<html lang="en">
	<head>

		<link rel="stylesheet" href="/style.css">
		<link rel="icon" href="/img/koala.png">
	</head>
	<body>
		<div class="header">
			<button>
				<a href="/">Home</a>
			</button>
            <button>
                <a href="./">Back</a>
            </button>
		</div>
        <div class="main">
		    <div class="float">
			    <h1>Volume: Question 5</h1>
                <p>
                    Fifty metal spheres with the radii of 4 m are melted and this melted solution is poured into a cube with base dimensions of 2 m × 6 m. Find the height of the cube filled with solution. Round to the nearest hundredth.
                </p>
		    </div>
            <div class="float">
                <form id="answerform">
                    <label for="answer">Answer:</label>
                    <input type="text" id="answer" name="answer">
                    <input type="submit" value="Submit">
                </form>
            </div>
        </div>
		<div class="footer">
			<p>
				&#8239;This page brought to you by Lukas
			</p>
		</div>
		<script>
			var answerform = document.getElementById('answerform');
			answerform.addEventListener('submit', function(event) {
				var answer = document.getElementById('answer').value;
				event.preventDefault();
				if(answer === '1116.44') {
					alert('Great job! You correctly answered the question. Click the \'Back\' button on the top bar to go back to the menu.');
					return;
				} else {
					alert('Incorrect answer. Please try again.');
					return;
				};
			});
		</script>
	</body>
